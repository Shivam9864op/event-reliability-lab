<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Event Reliability Lab personal open-source demo</title>
  <desc id="desc">A four-stage event pipeline showing signed intake, validation, idempotency and routing, then retry and dead-letter handling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061326"/><stop offset="1" stop-color="#0b1f3c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e68d1"/><stop offset="1" stop-color="#29d3d3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".16" stroke="#35a7ff" fill="none"><path d="M0 155 C220 70 310 245 520 145 S860 100 1060 180 S1350 275 1600 130"/><path d="M0 785 C250 690 330 850 590 765 S960 680 1200 780 S1430 855 1600 745"/><path d="M0 185 C220 100 310 270 520 170 S860 125 1060 205 S1350 300 1600 155"/></g>
  <text x="100" y="112" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="64" font-weight="700">Event Reliability Lab</text>
  <text x="103" y="162" fill="#9fb3d1" font-family="Arial, sans-serif" font-size="28">A minimal, end-to-end event pipeline for building reliable systems</text>
  <g transform="translate(100 245)" filter="url(#shadow)">
    <g><rect width="310" height="340" rx="20" fill="#0d2a51" stroke="#2f7fd8" stroke-width="2"/><circle cx="46" cy="48" r="24" fill="#1e68d1"/><text x="39" y="57" fill="white" font-family="Arial" font-size="24" font-weight="700">1</text><text x="32" y="150" fill="#f4f8ff" font-family="Arial" font-size="27" font-weight="700">Signed intake</text><text x="32" y="195" fill="#acc0da" font-family="Arial" font-size="21">Verify the source</text><text x="32" y="228" fill="#acc0da" font-family="Arial" font-size="21">before processing.</text><path d="M105 90 h90 v54 h-90z M120 103h55 M120 120h38" fill="none" stroke="#38d8d1" stroke-width="5"/></g>
    <g transform="translate(350)"><rect width="310" height="340" rx="20" fill="#0d2a51" stroke="#2f7fd8" stroke-width="2"/><circle cx="46" cy="48" r="24" fill="#1e68d1"/><text x="39" y="57" fill="white" font-family="Arial" font-size="24" font-weight="700">2</text><text x="32" y="150" fill="#f4f8ff" font-family="Arial" font-size="27" font-weight="700">Validate + normalize</text><text x="32" y="195" fill="#acc0da" font-family="Arial" font-size="21">Reject malformed</text><text x="32" y="228" fill="#acc0da" font-family="Arial" font-size="21">payloads early.</text><path d="M105 91l50 62 50-62 M130 128h50" fill="none" stroke="#38d8d1" stroke-width="6"/></g>
    <g transform="translate(700)"><rect width="310" height="340" rx="20" fill="#0d2a51" stroke="#2f7fd8" stroke-width="2"/><circle cx="46" cy="48" r="24" fill="#1e68d1"/><text x="39" y="57" fill="white" font-family="Arial" font-size="24" font-weight="700">3</text><text x="32" y="150" fill="#f4f8ff" font-family="Arial" font-size="27" font-weight="700">Idempotency + routing</text><text x="32" y="195" fill="#acc0da" font-family="Arial" font-size="21">Deduplicate, then</text><text x="32" y="228" fill="#acc0da" font-family="Arial" font-size="21">choose a safe sink.</text><circle cx="140" cy="117" r="31" fill="none" stroke="#38d8d1" stroke-width="6"/><path d="M140 90v54 M113 117h54" stroke="#38d8d1" stroke-width="6"/></g>
    <g transform="translate(1050)"><rect width="310" height="340" rx="20" fill="#0d2a51" stroke="#2f7fd8" stroke-width="2"/><circle cx="46" cy="48" r="24" fill="#1e68d1"/><text x="39" y="57" fill="white" font-family="Arial" font-size="24" font-weight="700">4</text><text x="32" y="150" fill="#f4f8ff" font-family="Arial" font-size="27" font-weight="700">Retry / DLQ</text><text x="32" y="195" fill="#acc0da" font-family="Arial" font-size="21">Back off safely;</text><text x="32" y="228" fill="#acc0da" font-family="Arial" font-size="21">park failures.</text><path d="M125 113a45 45 0 1 1-9-31 M115 78l2 30 28-9" fill="none" stroke="#38d8d1" stroke-width="6"/></g>
    <path d="M318 170h28 M668 170h28 M1018 170h28" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/><path d="m340 155 18 15-18 15 M690 155 708 170l-18 15 M1040 155l18 15-18 15" fill="none" stroke="#29d3d3" stroke-width="6"/>
  </g>
  <rect x="100" y="665" width="1360" height="112" rx="20" fill="#0a1d38" stroke="#1f5fae" stroke-width="2"/>
  <text x="145" y="713" fill="#38d8d1" font-family="Arial" font-size="24" font-weight="700">SECURITY FIRST</text><text x="145" y="748" fill="#a9bdd7" font-family="Arial" font-size="20">HMAC verification • redacted logs</text>
  <text x="630" y="713" fill="#38d8d1" font-family="Arial" font-size="24" font-weight="700">OBSERVABLE</text><text x="630" y="748" fill="#a9bdd7" font-family="Arial" font-size="20">Trace IDs • audit events</text>
  <text x="1080" y="713" fill="#38d8d1" font-family="Arial" font-size="24" font-weight="700">EXPLAINABLE</text><text x="1080" y="748" fill="#a9bdd7" font-family="Arial" font-size="20">Deterministic tests • safe failures</text>
  <rect x="480" y="825" width="640" height="42" rx="21" fill="#102e53" stroke="#2f7fd8"/><text x="800" y="853" text-anchor="middle" fill="#d1def0" font-family="Arial" font-size="19">Personal open-source demo • synthetic data only</text>
</svg>
