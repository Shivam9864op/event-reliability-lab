<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="180" viewBox="0 0 1100 180" role="img" aria-labelledby="title desc">
  <title id="title">Event Reliability Lab architecture</title>
  <desc id="desc">Webhook intake flows through validation, idempotency, routing and delivery, with retry and dead-letter branches.</desc>
  <style>text{font:14px system-ui,sans-serif;fill:#17202a}.box{fill:#eef5ff;stroke:#3867d6;stroke-width:2}.side{fill:#fff4e6;stroke:#cc8b00;stroke-width:2}.arrow{stroke:#425466;stroke-width:2;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#425466"/></marker></defs>
  <rect class="box" x="20" y="65" width="150" height="50" rx="8"/><text x="95" y="95" text-anchor="middle">Webhook intake</text>
  <rect class="box" x="220" y="65" width="150" height="50" rx="8"/><text x="295" y="95" text-anchor="middle">Validate + HMAC</text>
  <rect class="box" x="420" y="65" width="150" height="50" rx="8"/><text x="495" y="95" text-anchor="middle">Idempotency</text>
  <rect class="box" x="620" y="65" width="150" height="50" rx="8"/><text x="695" y="95" text-anchor="middle">Route + deliver</text>
  <rect class="side" x="850" y="20" width="180" height="45" rx="8"/><text x="940" y="48" text-anchor="middle">Retry with backoff</text>
  <rect class="side" x="850" y="115" width="180" height="45" rx="8"/><text x="940" y="143" text-anchor="middle">Dead-letter + review</text>
  <path class="arrow" d="M170 90 H220"/><path class="arrow" d="M370 90 H420"/><path class="arrow" d="M570 90 H620"/><path class="arrow" d="M770 75 Q810 45 850 43"/><path class="arrow" d="M770 105 Q810 135 850 138"/>
</svg>
